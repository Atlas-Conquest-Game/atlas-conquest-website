name: Update Game Data

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual trigger (the "Refresh Data" button)

permissions:
  contents: write
  actions: write  # needed to dispatch the deploy-site workflow
  id-token: write  # signs in to AWS as atlas-conquest-analytics-reader (no stored key)

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Short-lived credentials for a role that can only read games and game_actions,
      # issued to runs of this repo's main branch alone. The AWS trust policy is the gate.
      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::426419564189:role/atlas-conquest-analytics-reader
          aws-region: us-east-2

      - name: Fetch data from AWS
        run: python scripts/fetch_data.py

      # Derived analytics v2 layer (site/data/insights/) built from the JSON
      # fetch_data.py just published. Writes only under site/data/insights/,
      # so the commit step below picks it up with the rest of site/data/.
      # The card changelog diffs against the state committed in
      # site/data/insights/_state/, so the shallow checkout is enough.
      # Non-blocking: if it fails it writes nothing (previous insights stay)
      # and shows an error annotation, and the daily data commit still runs.
      - name: Build insights
        id: insights
        continue-on-error: true
        run: python scripts/build_insights.py

      - name: Run pipeline tests
        run: pytest scripts/tests/ -v --tb=short

      # Regenerate per-commander 1200×630 OG hero images + deck-unfurl pages
      # after each data refresh so newly added commanders automatically get
      # Discord-friendly link previews without a manual rebuild step.
      # Order matters: images first, then pages (pages reference the images).
      - name: Generate per-commander OG images
        run: python scripts/generate_og_images.py

      - name: Generate per-commander deck pages
        run: python scripts/generate_deck_pages.py

      # Build the Articles section: turns articles/*.md into static HTML at
      # site/articles/<slug>/index.html using scripts/build_articles.py. Runs
      # after generate_deck_pages so deck embeds can link out to the freshly
      # generated per-commander deck pages.
      - name: Build articles
        run: python scripts/build_articles.py

      # Press kit card images: the list the Press page searches
      # (site/data/press_cards.json) and the all-cards ZIP on the `press-kit`
      # release. The ZIP is rebuilt only when CardScreenshots/ changed; the
      # release notes record the tree it was built from. Non-blocking: a
      # failure leaves the previous list and ZIP in place.
      - name: Refresh press kit card images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tree=$(git rev-parse HEAD:CardScreenshots)
          if gh release view press-kit --json body --jq .body | grep -q "$tree"; then
            python scripts/build_press_cards.py
          else
            python scripts/build_press_cards.py --zip /tmp/AtlasConquest-Cards.zip
            gh release upload press-kit /tmp/AtlasConquest-Cards.zip --clobber
            gh release edit press-kit --notes "Every Atlas Conquest card as an 800x1120 PNG on a transparent background, for the press kit at https://atlas-conquest.com/press.html. Rebuilt automatically from CardScreenshots tree $tree."
          fi

      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/ site/assets/ site/decks/ site/articles/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update game data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN pushes don't trigger other workflows (GitHub's anti-loop guard),
      # so explicitly dispatch the deploy workflow when data actually changed.
      - name: Trigger site deploy
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --ref main

      - name: Generate daily summary
        if: success()
        run: python scripts/daily_summary.py

      - name: Notify Discord on success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          payload=$(python -c "import json; print(json.dumps({'content': open('scripts/daily_summary.txt').read()}))")
          curl -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROSS_ID: ${{ secrets.DISCORD_ROSS_ID }}
          MALATAK_ID: ${{ secrets.DISCORD_MALATAK_ID }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"<@${ROSS_ID}> <@${MALATAK_ID}> **Pipeline failed!** Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"
